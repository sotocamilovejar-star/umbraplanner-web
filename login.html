<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — CronosPlanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Plus+Jakarta+Sans:wght@700;800&family=Syne:wght@800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--r-pill:999px;--ease:.22s cubic-bezier(.4,0,.2,1);}
[data-theme="dark"]{
  --bg:#0d0d14;--bg2:#13131f;
  --surf:rgba(255,255,255,.04);--bdr:rgba(255,255,255,.09);
  --bdr2:rgba(124,106,247,.38);
  --txt:#e4e2ff;--txt2:#8b88b8;--txt3:#3e3c60;
  --acc:#7c6af7;--glow:rgba(124,106,247,.35);
  --inp:rgba(255,255,255,.06);--inp-hov:rgba(255,255,255,.09);
}

body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);color:var(--txt);
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:24px;
  overflow-x:hidden;
}

/* Orbs decorativos de fondo */
.orb{position:fixed;border-radius:50%;pointer-events:none;}
.orb1{top:-220px;left:-200px;width:700px;height:700px;
  background:radial-gradient(circle,rgba(124,106,247,.08),transparent 70%);}
.orb2{bottom:-120px;right:-100px;width:550px;height:550px;
  background:radial-gradient(circle,rgba(56,189,248,.06),transparent 68%);}

/* Logo */
.logo-wrap{
  display:flex;align-items:center;gap:10px;margin-bottom:28px;
  font-family:'Syne',sans-serif;font-size:20px;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(130deg,#a78bfa,#38bdf8);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  text-decoration:none;
}

/* Card principal */
.card{
  background:rgba(255,255,255,.035);
  border:1px solid var(--bdr);border-radius:22px;
  padding:38px 40px;width:100%;max-width:420px;
  box-shadow:0 24px 64px rgba(0,0,0,.45),0 0 0 1px rgba(124,106,247,.06);
  position:relative;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;border-radius:22px 22px 0 0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);
}

/* Tabs Crear cuenta / Iniciar sesión */
.tabs{
  display:flex;gap:3px;
  background:rgba(255,255,255,.04);border:1px solid var(--bdr);
  border-radius:var(--r-pill);padding:4px;margin-bottom:28px;
}
.tab{
  flex:1;padding:9px 0;border-radius:var(--r-pill);
  font-size:14px;font-weight:600;color:var(--txt2);
  cursor:pointer;border:none;background:transparent;
  transition:all var(--ease);font-family:'DM Sans',sans-serif;
}
.tab.act{background:var(--acc);color:#fff;box-shadow:0 0 16px var(--glow);}

/* Grupos de campo */
.form-group{margin-bottom:16px;}
label{display:block;font-size:12.5px;font-weight:600;color:var(--txt2);margin-bottom:7px;letter-spacing:.01em;}
input{
  width:100%;background:var(--inp);border:1px solid var(--bdr);
  border-radius:10px;padding:12px 14px;
  font-size:14.5px;color:var(--txt);
  font-family:'DM Sans',sans-serif;
  transition:border-color var(--ease),background var(--ease),box-shadow var(--ease);
  outline:none;
}
input:hover{background:var(--inp-hov);}
input:focus{
  border-color:var(--bdr2);background:var(--inp-hov);
  box-shadow:0 0 0 3px rgba(124,106,247,.13);
}
input::placeholder{color:var(--txt3);}

/* Botón principal */
.btn{
  width:100%;padding:13px;border-radius:var(--r-pill);
  font-size:15px;font-weight:700;cursor:pointer;border:none;
  font-family:'DM Sans',sans-serif;transition:all var(--ease);margin-top:6px;
}
.btn-primary{
  background:var(--acc);color:#fff;
  box-shadow:0 0 22px var(--glow);
}
.btn-primary:hover{filter:brightness(1.12);box-shadow:0 0 36px var(--glow);transform:translateY(-1px);}
.btn-primary:active{transform:translateY(0);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;filter:none;transform:none;}

/* Mensaje error / éxito */
.msg{
  padding:11px 14px;border-radius:10px;
  font-size:13px;font-weight:500;line-height:1.5;
  margin-bottom:16px;display:none;
}
.msg.error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.28);color:#fca5a5;}
.msg.success{background:rgba(34,197,94,.09);border:1px solid rgba(34,197,94,.25);color:#86efac;}
.msg.show{display:block;}

/* Olvidé contraseña */
.forgot{font-size:12.5px;color:var(--txt2);text-align:right;margin-top:-8px;margin-bottom:16px;}
.forgot a{color:var(--acc);text-decoration:none;font-weight:600;}
.forgot a:hover{text-decoration:underline;}

/* Link volver */
.back{margin-top:20px;font-size:13px;color:var(--txt2);text-align:center;}
.back a{color:var(--acc);text-decoration:none;font-weight:600;}
.back a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<!-- Logo / volver a landing -->
<a href="/cronos-web/index.html" class="logo-wrap">
  <svg width="34" height="34" viewBox="0 0 100 100" fill="none">
    <defs>
      <radialGradient id="lg" cx="36%" cy="28%" r="82%">
        <stop offset="0%" stop-color="#a78bfa"/>
        <stop offset="100%" stop-color="#4c1d95"/>
      </radialGradient>
    </defs>
    <rect width="100" height="100" rx="22" fill="url(#lg)"/>
    <path d="M20,17 C15,12 15,12 22,12 L78,12 C85,12 85,12 80,17 L59,43 C57,45 57,45 57,48 L57,52 C57,55 57,55 59,57 L80,83 C85,88 85,88 78,88 L22,88 C15,88 15,88 20,83 L41,57 C43,55 43,55 43,52 L43,48 C43,45 43,45 41,43 L20,17 Z" fill="white" opacity="0.92"/>
  </svg>
  CronosPlanner
</a>

<!-- Card de autenticación -->
<div class="card">

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab" id="tabRegister" onclick="window.switchTab('register')">Crear cuenta</button>
    <button class="tab" id="tabLogin"    onclick="window.switchTab('login')">Iniciar sesión</button>
  </div>

  <!-- Mensaje de estado -->
  <div class="msg" id="msg"></div>

  <!-- ── Formulario Registro ── -->
  <form id="formRegister" onsubmit="window.handleRegister(event)">
    <div class="form-group">
      <label for="regEmail">Email</label>
      <input type="email" id="regEmail" placeholder="tu@email.com" required autocomplete="email">
    </div>
    <div class="form-group">
      <label for="regPass">Contraseña</label>
      <input type="password" id="regPass" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label for="regPass2">Confirmar contraseña</label>
      <input type="password" id="regPass2" placeholder="Repetir contraseña" required autocomplete="new-password">
    </div>
    <button type="submit" class="btn btn-primary" id="btnRegister">Crear cuenta gratis →</button>
  </form>

  <!-- ── Formulario Login ── -->
  <form id="formLogin" onsubmit="window.handleLogin(event)" style="display:none;">
    <div class="form-group">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" placeholder="tu@email.com" required autocomplete="email">
    </div>
    <div class="form-group">
      <label for="loginPass">Contraseña</label>
      <input type="password" id="loginPass" placeholder="Tu contraseña" required autocomplete="current-password">
    </div>
    <div class="forgot">
      <a href="#" onclick="window.handleForgot(event)">¿Olvidaste tu contraseña?</a>
    </div>
    <button type="submit" class="btn btn-primary" id="btnLogin">Iniciar sesión →</button>
  </form>

</div>

<div class="back">
  <a href="/cronos-web/index.html">← Volver a la landing</a>
</div>

<script type="module">
  import { signUp, signIn, supabase } from './supabase.js'

  // ── Funciones (definir ANTES de usarlas) ────────────────────────

  window.switchTab = function(tab) {
    const isReg = (tab === 'register')
    document.getElementById('tabRegister').classList.toggle('act',  isReg)
    document.getElementById('tabLogin').classList.toggle('act',    !isReg)
    document.getElementById('formRegister').style.display = isReg ? '' : 'none'
    document.getElementById('formLogin').style.display    = isReg ? 'none' : ''
    hideMsg()
  }

  window.handleRegister = async function(e) {
    e.preventDefault()
    const email = document.getElementById('regEmail').value.trim()
    const pass  = document.getElementById('regPass').value
    const pass2 = document.getElementById('regPass2').value
    if (pass !== pass2) { showMsg('Las contraseñas no coinciden.', 'error'); return }
    const btn = document.getElementById('btnRegister')
    btn.disabled = true; btn.textContent = 'Creando cuenta...'
    try {
      await signUp(email, pass)
      showMsg('¡Cuenta creada! Redirigiendo...', 'success')
      setTimeout(() => { window.location.href = '/cronos-web/app.html' }, 1200)
    } catch (err) {
      showMsg(translateError(err.message), 'error')
      btn.disabled = false; btn.textContent = 'Crear cuenta gratis →'
    }
  }

  window.handleLogin = async function(e) {
    e.preventDefault()
    const email = document.getElementById('loginEmail').value.trim()
    const pass  = document.getElementById('loginPass').value
    const btn = document.getElementById('btnLogin')
    btn.disabled = true; btn.textContent = 'Entrando...'
    try {
      await signIn(email, pass)
      window.location.href = '/cronos-web/app.html'
    } catch (err) {
      showMsg(translateError(err.message), 'error')
      btn.disabled = false; btn.textContent = 'Iniciar sesión →'
    }
  }

  window.handleForgot = async function(e) {
    e.preventDefault()
    const email = document.getElementById('loginEmail').value.trim()
    if (!email) { showMsg('Ingresa tu email primero para recuperar la contraseña.', 'error'); return }
    const { error } = await supabase.auth.resetPasswordForEmail(email)
    if (error) { showMsg(translateError(error.message), 'error'); return }
    showMsg('✓ Se envió un link de recuperación a ' + email, 'success')
  }

  // ── Helpers ─────────────────────────────────────────────────────
  function showMsg(text, type) {
    const el = document.getElementById('msg')
    el.textContent = text
    el.className = 'msg ' + type + ' show'
  }
  function hideMsg() {
    document.getElementById('msg').className = 'msg'
  }
  function translateError(msg) {
    if (msg.includes('already registered'))  return 'Este email ya tiene una cuenta. ¿Quieres iniciar sesión?'
    if (msg.includes('User already'))        return 'Este email ya tiene una cuenta. ¿Quieres iniciar sesión?'
    if (msg.includes('Invalid login'))       return 'Email o contraseña incorrectos.'
    if (msg.includes('Invalid email'))       return 'El email no es válido.'
    if (msg.includes('Password should'))     return 'La contraseña debe tener al menos 6 caracteres.'
    if (msg.includes('Unable to validate'))  return 'Email inválido.'
    if (msg.includes('Email not confirmed')) return 'Confirma tu email antes de entrar (revisa tu bandeja).'
    return msg
  }

  // ── Activar tab correcto según URL (?tab=register o ?tab=login) ─
  const initTab = new URLSearchParams(window.location.search).get('tab') || 'register'
  window.switchTab(initTab)
</script>
</body>
</html>
