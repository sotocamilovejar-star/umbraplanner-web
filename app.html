<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UmbraPlanner — App</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,700&family=Syne:wght@800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:'DM Sans',sans-serif;background:#0d0d14;color:#e4e2ff;display:flex;flex-direction:column;}

/* ── Pantalla de carga ──────────────────────────────────────────── */
#loading{
  position:fixed;inset:0;background:#0d0d14;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:20px;z-index:9999;
  transition:opacity .45s ease;
}
#loading.fade-out{opacity:0;pointer-events:none;}
.loading-logo{
  font-family:'Syne',sans-serif;font-size:24px;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(130deg,#a78bfa,#38bdf8);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  display:flex;align-items:center;gap:10px;
}
.spinner{
  width:32px;height:32px;
  border:3px solid rgba(124,106,247,.18);
  border-top-color:#7c6af7;
  border-radius:50%;
  animation:spin .65s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── iframe de la app ───────────────────────────────────────────── */
#appFrame{
  flex:1;border:none;width:100%;
  display:none;
}
#appFrame.show{display:block;}
</style>
</head>
<body>

<!-- Pantalla de carga mientras se verifica la sesión -->
<div id="loading">
  <div class="loading-logo">
    <img src="./assets/icon.png" width="32" height="32" alt="UmbraPlanner" style="border-radius:9px;">
    UmbraPlanner
  </div>
  <div class="spinner"></div>
</div>

<!-- La app carga aquí (sin src — lo asigna showApp para evitar race con el auth) -->
<iframe
  id="appFrame"
  title="UmbraPlanner App"
  sandbox="allow-scripts allow-same-origin allow-forms allow-downloads allow-modals">
</iframe>

<script type="module">
  import { supabase, signOut } from './supabase.js'

  const APP_URL = window.location.hostname === 'localhost'
    ? 'http://localhost:5555/horario_editor.html'
    : '/editor.html'

  let appShown = false

  // Preservar intención de checkout a través del login
  const _checkoutParam = new URLSearchParams(window.location.search).get('checkout')
  if (_checkoutParam) sessionStorage.setItem('umbra-pending-checkout', _checkoutParam)

  function showApp(session) {
    if (appShown) return
    appShown = true

    const meta = session.user?.user_metadata || {}
    const name  = meta.full_name || meta.name || ''
    const email = session.user?.email || ''

    const frame = document.getElementById('appFrame')

    frame.addEventListener('load', () => {
      // Ocultar pantalla de carga
      const loading = document.getElementById('loading')
      loading.classList.add('fade-out')
      setTimeout(() => { loading.style.display = 'none' }, 500)

      // Enviar datos de sesión al iframe
      setTimeout(() => {
        frame.contentWindow.postMessage(
          { type: 'umbra-user-session', user: { name, email } },
          '*'
        )
        // Si hay checkout pendiente, abrirlo después de que el editor inicialice
        const pending = sessionStorage.getItem('umbra-pending-checkout')
        if (pending) {
          sessionStorage.removeItem('umbra-pending-checkout')
          setTimeout(() => {
            frame.contentWindow.postMessage({ type: 'umbra-checkout', plan: pending }, '*')
          }, 1200)
        }
      }, 400)
    }, { once: true })

    // Asignar src DESPUÉS de poner el listener — así el load siempre se captura
    frame.src = APP_URL
    frame.classList.add('show')
  }

  // Escuchar mensajes del iframe
  window.addEventListener('message', (e) => {
    if (e.data?.type === 'umbra-sign-out') signOut()
    if (e.data?.type === 'umbra-navigate') window.location.href = e.data.url
    if (e.data?.type === 'umbra-reload') window.location.reload()
  })

  // onAuthStateChange maneja sesión existente + callback OAuth
  supabase.auth.onAuthStateChange((event, session) => {
    if (event === 'INITIAL_SESSION' || event === 'SIGNED_IN') {
      if (session) {
        showApp(session)
      } else if (event === 'INITIAL_SESSION') {
        window.location.href = './login.html'
      }
    }
  })
</script>
</body>
</html>
